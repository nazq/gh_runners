name: CI

on:
  pull_request:
    branches: [main]
  # Also on push to main: a PR gate alone never verifies main itself, so a
  # semantic-release commit or a direct push could break it unnoticed. This
  # is also what produces the coverage baseline Codecov compares PRs against.
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy --strict gh_runners/

      # fail_under = 95 lives in pyproject.toml, so this step is the gate.
      - name: Test
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Build
        run: uv build

  # The tool targets Linux and Windows, and a good deal of its logic branches
  # on which. Testing only on Linux would leave the Windows paths unverified
  # on the platform where they actually run.
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Test
        run: uv run pytest -q
