[project]
name = "gh-runners"
version = "2.3.0"
description = "GitHub Actions self-hosted runner manager for Linux, Windows, and more"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "nazq" }]
keywords = ["github-actions", "self-hosted", "runners", "ci", "cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["typer>=0.15"]

[project.urls]
Repository = "https://github.com/nazq/gh_runners"
Issues = "https://github.com/nazq/gh_runners/issues"

[project.scripts]
gh-runners = "gh_runners.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "no_platform_stub: do not force is_linux/is_windows (for platform-detection tests)",
    "posix_only: exercises functionality that exists only on Linux/macOS",
]

[tool.coverage.run]
source = ["gh_runners"]
branch = true

[tool.coverage.report]
# The bar is 95%. Everything excluded below is unreachable in a test
# process by construction, not merely inconvenient to reach.
fail_under = 95
show_missing = true
# Deliberately short. Platform branches are NOT excluded: the test suite
# stubs is_windows/is_linux, so both halves are reachable from any host, and
# excluding them would hide the Windows paths from the 95% gate entirely.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
build_command = ""

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
