[project]
name = "gh-runners"
version = "1.0.0"
description = "GitHub Actions self-hosted runner manager for Linux, Windows, and more"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "nazq" }]
keywords = ["github-actions", "self-hosted", "runners", "ci", "cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["typer>=0.15"]

[project.urls]
Repository = "https://github.com/nazq/gh_runners"
Issues = "https://github.com/nazq/gh_runners/issues"

[project.scripts]
ghr = "gh_runners.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.1",
]
